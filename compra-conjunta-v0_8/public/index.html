<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#155d46"><title>Compra Conjunta | Acesso</title><style>:root{font-family:system-ui,Arial;color:#193e31;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}header{background:#145d43;color:#fff;padding:19px 5%;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}header strong{font-size:23px}header a{color:#fff}main{max-width:1050px;margin:34px auto;padding:0 18px}.card{background:#fff;border:1px solid #dae9df;border-radius:18px;padding:23px;box-shadow:0 5px 20px #0b51330b;margin-bottom:16px}h1{font-size:clamp(23px,4vw,35px)}h2{font-size:21px}p{color:#668073}input,select{padding:12px;border:1px solid #cbded2;border-radius:9px;width:100%;margin:6px 0 13px}button{background:#16734c;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700;margin:4px 7px 4px 0}button.secondary{background:#e7f2ea;color:#1d6845}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}.stat{background:#f0f7f2;border-radius:12px;padding:16px}label{font-size:13px;font-weight:700}table{width:100%;border-collapse:collapse;min-width:430px}td,th{padding:12px;border-bottom:1px solid #e4eee8;text-align:left}div.scroll{overflow:auto}.notice{background:#fff6e7;border-radius:10px;padding:12px;color:#765116}.muted{font-size:13px;color:#6b8476}.hidden{display:none}.error{color:#ad2626}.role{background:#e8f4eb;padding:5px 10px;border-radius:15px;display:inline-block;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}a{color:#176e4b} @media(max-width:600px){.card{padding:16px}}</style></head><body><header><strong>🛒 Compra Conjunta</strong><nav><a href="/legacy.html">Vitrine demonstrativa</a></nav></header><main><div id="login" class="card" style="max-width:480px;margin:45px auto"><h1>Acessar minha conta</h1><p>Ambientes de cliente, administrador do sistema e administrador de loja.</p><form id="loginForm"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Entrar</button></form><p id="message" class="error" role="alert"></p><div class="notice"><b>Ambiente local de testes</b><p class="muted">Usuários demonstrativos estão no README. Não utilizar dados pessoais reais.</p></div></div><div id="app" class="hidden"><div class="row"><div><h1 id="welcome"></h1><p>Selecione seu ambiente autorizado.</p></div><button class="secondary" onclick="logout()">Sair</button></div><div id="switches"></div><div id="view"></div></div></main><script src="/rate-simulator.js" defer></script><script src="/chat.js" defer></script><script>
let user=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){let r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let v=await r.json();if(!r.ok)throw Error(v.error||'Erro na operação');return v}
function showAccount(u){user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Olá, '+u.name;let roles=[{role:'customer',name:'Cliente'},{role:'system_admin',name:'Administrador do Sistema'},...u.roles.filter(x=>x.role==='store_admin').map(x=>({...x,name:'Administrar '+x.storeId}))];$('switches').innerHTML=roles.filter(x=>x.role==='customer'||u.roles.some(y=>y.role===x.role&&(x.role!=='store_admin'||y.storeId===x.storeId))).map(x=>`<button class="secondary" data-role="${esc(x.role)}" data-store="${esc(x.storeId||'')}">${esc(x.name)}</button>`).join('');$('switches').querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.role,b.dataset.store));load(roles.find(r=>u.roles.some(z=>z.role===r.role))?.role||'customer',u.roles.find(x=>x.role==='store_admin')?.storeId||'')}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('message').textContent='';try{let f=new FormData(e.target);let v=await api('/api/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});showAccount(v.user)}catch(e){$('message').textContent=e.message}};
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function load(role,storeId){$('view').innerHTML='<p>Carregando…</p>';try{if(role==='customer'){const d=await api('/api/customer');$('view').innerHTML=`<div class="card"><h2>Meu painel de cliente</h2><div class="grid"><div class="stat">🛒 Comprar produtos<br><a href="/legacy.html">Abrir vitrine demonstrativa</a></div><div class="stat">📦 Meus pedidos<br><b>${d.orders.length}</b></div><div class="stat">🏪 Clique e Retire<br>Acompanhe seus pedidos</div></div><p class="notice">Pedidos da vitrine legada ficam no navegador e ainda não estão integrados à conta.</p><div id="clientChat"></div></div>`;setTimeout(()=>window.CCChat?.customer(api,esc),0);}else if(role==='system_admin'){const d=await api('/api/system');$('view').innerHTML=`<div class="card"><h2>Administrador do Sistema</h2><div class="grid"><div class="stat"><b>${d.users.length}</b><p>Usuários</p></div><div class="stat"><b>${d.stores.length}</b><p>Lojas</p></div><div class="stat"><b>${d.ordersCount}</b><p>Pedidos</p></div></div><h3>Taxas de intermediação — consulta</h3>${d.rates.map(r=>`<p>${esc(r.category)}: ${Number(r.percent)}%</p>`).join('')}<button id="openRateSimulator" class="secondary">📊 Simulador de Taxas — cenários fictícios</button><div id="rateSimulator"></div><h3>Lojas cadastradas</h3>${d.stores.map(s=>`<p>🏪 ${esc(s.name)}</p>`).join('')}<h3>Auditoria recente</h3>${d.audit.map(x=>`<p class="muted">${esc(x.time)} — ${esc(x.action)} — ${esc(x.entity)}</p>`).join('')||'<p>Sem eventos registrados</p>'}<p class="notice">Cadastros, aprovação de lojas, publicidade e split real ainda serão integrados ao backend.</p></div>`;setTimeout(()=>{const b=$('openRateSimulator');if(b)b.onclick=()=>openRateSimulator(api,esc)},0);}else if(role==='store_admin'){const d=await api('/api/store?storeId='+encodeURIComponent(storeId));$('view').innerHTML=`<div class="card"><h2>Minha Loja — ${esc(d.store?.name)}</h2><p>${esc(d.store?.address)}</p><div class="grid"><div class="stat"><b>${d.orders.length}</b><p>Pedidos da loja</p></div><div class="stat">📦 Pedidos e retirada</div><div class="stat">💰 Relatórios financeiros (futuro)</div></div><h3>Central de Atendimento — IA + Humano</h3><div id="storeChat"></div><h3>Produtos — importação em lote</h3><p>Envie um CSV (UTF-8) com colunas <code>sku;name;category;price;stock;expiry;batch</code>. A importação atualiza registros com mesmo código e lote, mantendo os preços definidos por sua loja.</p><p><a download="modelo_produtos.csv" href="/modelo_produtos.csv">⬇ Baixar planilha modelo CSV</a></p><input type="file" id="csvUpload" accept=".csv,text/csv"><button id="previewCsv" class="secondary">Pré-visualizar produtos</button><div id="csvPreview"></div><h3>Produtos cadastrados</h3><div id="productList">Carregando…</div><h3>Pedidos</h3><div class="scroll"><table><tr><th>Pedido</th><th>Valor</th><th>Situação</th><th>Ação</th></tr>${d.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${(o.total/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td><td>${esc(o.status)}</td><td>${['a_separar','em_preparacao'].includes(o.status)?`<button data-order="${esc(o.id)}" data-status="${o.status==='a_separar'?'em_preparacao':'pronto_para_retirada'}">Avançar</button>`:'—'}</td></tr>`).join('')}</table></div><p class="notice">Somente pedidos vinculados a esta loja são fornecidos pela API.</p></div>`;loadProducts(storeId);setTimeout(()=>window.CCChat?.store(api,esc,storeId),0);
$('previewCsv').onclick=async()=>{let file=$('csvUpload').files[0];if(!file){alert('Escolha um arquivo CSV');return;}if(file.size>100000){alert('Arquivo excede 100 KB');return;}try{const rows=parseImportCsv(await file.text());if(rows.length>100)throw Error('Máximo de 100 produtos por importação');window.importRows=rows;const fmt=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});$('csvPreview').innerHTML=`<p>${rows.length} produtos identificados. Revise antes de confirmar:</p><div class="scroll"><table><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Validade</th></tr>${rows.map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${fmt(r.price)}</td><td>${esc(r.stock)}</td><td>${esc(r.expiry)}</td></tr>`).join('')}</table></div><button id="confirmImport">Confirmar importação</button>`;$('confirmImport').onclick=async()=>{if(!confirm('Importar ou atualizar '+rows.length+' produtos na sua loja?'))return;try{let v=await api('/api/store/products/import',{method:'POST',body:JSON.stringify({storeId,rows})});alert(`${v.created} cadastrados, ${v.updated} atualizados.`);load('store_admin',storeId)}catch(e){$('csvPreview').insertAdjacentHTML('beforeend','<p class="error">'+esc(e.message)+'</p>')}}}catch(e){$('csvPreview').textContent=e.message}};
$('view').querySelectorAll('button[data-order]').forEach(b=>b.onclick=async()=>{try{await api('/api/store/'+encodeURIComponent(storeId)+'/orders/'+encodeURIComponent(b.dataset.order)+'/status',{method:'POST',body:JSON.stringify({status:b.dataset.status})});load(role,storeId)}catch(e){alert(e.message)}})}}catch(e){$('view').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}
async function loadProducts(storeId){try{const d=await api('/api/store/products?storeId='+encodeURIComponent(storeId));$('productList').innerHTML=d.products.length?`<div class="scroll"><table><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Validade</th></tr>${d.products.map(r=>`<tr><td>${esc(r.sku)}</td><td>${esc(r.name)}</td><td>${esc(r.category)}</td><td>${(r.priceCents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td><td>${r.stock}</td><td>${esc(r.expiry||'—')}</td></tr>`).join('')}</table></div>`:'<p>Nenhum produto importado.</p>'}catch(e){$('productList').textContent=e.message}}
function parseImportCsv(input){const lines=input.replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(lines.length<2)throw Error('Arquivo sem produtos');const delimiter=lines[0].includes(';')?';':',';const h=lines.shift().split(delimiter).map(x=>x.trim().toLowerCase());const cols=['sku','name','category','price','stock','expiry','batch'];if(!cols.every(c=>h.includes(c)))throw Error('Cabeçalho inválido: '+cols.join(';'));
return lines.filter(Boolean).map((line,i)=>{const v=line.split(delimiter);if(v.length!==h.length)throw Error('Colunas incorretas na linha '+(i+2));const r=Object.fromEntries(h.map((k,j)=>[k,v[j].trim().replace(/^"|"$/g,'')]));r.price=Number(r.price.replace(',','.'));r.stock=Number(r.stock);return r})}
api('/api/me').then(v=>showAccount(v.user)).catch(()=>{});
</script></body></html>
